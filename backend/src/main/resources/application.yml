spring:
  application:
    name: devpulse-backend
  # Defaults support lightweight local runs; Compose selects the production profile for PostgreSQL.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:devpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  http:
    client:
      # Outbound calls (e.g. to the AI service) must never block a request thread forever.
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:10s}

server:
  port: ${SERVER_PORT:8081}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  # No default on purpose: the app refuses to start without a strong JWT_SECRET (see JwtProperties).
  secret: ${JWT_SECRET:}
  expiration: 3600000
  refresh-expiration: 604800000

devpulse:
  cors:
    # Browser-based local dev commonly uses a random Angular port (for example 49337)
    # even when the app is proxied to the backend. Keep a few common local origins here.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:49337,http://127.0.0.1:49337}
  demo:
    # Off by default: demo mode creates a known account (demo@devpulse.local). Enable explicitly for local demos only.
    enabled: ${DEMO_MODE:false}
  chaos:
    # Chaos simulations are refused for projects whose environment is "production"
    # unless this is explicitly set to true. See ChaosService.
    allow-production: ${CHAOS_ALLOW_PRODUCTION:false}
  alerts:
    webhook-url: ${ALERT_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
