# Test-only configuration. Lives in src/test/resources, so it is never packaged
# in the production jar. It is merged with (and overrides) src/main/resources/application.yml.
jwt.secret=test-only-secret-never-use-outside-unit-tests-0123456789
jwt.access-token-ttl-seconds=3600
jwt.refresh-token-ttl-seconds=604800
# The dedicated filter tests verify throttling; integration flows share one mock client IP.
devpulse.auth-rate-limit.enabled=false
