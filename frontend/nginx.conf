server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Baseline security headers. None of the locations below uses add_header,
    # so these are inherited by every response (nginx drops inherited headers
    # as soon as a location defines its own add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Angular client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the hashed bundles: always revalidate it so a new
    # release is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Angular emits content-hashed file names for scripts, styles and fonts,
    # so they can be cached for a year. (favicon.ico is not hashed: excluded.)
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
    }

    # Reverse-proxy API calls to the backend container (see docker-compose.yml).
    # ^~ keeps the regex locations above from ever matching an /api/ URL.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend already sets these; hide them to avoid duplicated headers.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }
}
