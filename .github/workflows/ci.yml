name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build and run tests (backend)
        working-directory: backend
        run: mvn -B -V -T 1C clean test

      - name: Package backend
        working-directory: backend
        run: mvn -B -V -T 1C -DskipTests package

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  test-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest

  scan-containers:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-ai-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container images
        run: |
          docker build -t devpulse/backend:${{ github.sha }} ./backend
          docker build -t devpulse/ai-service:${{ github.sha }} ./ai-service
          docker build -t devpulse/frontend:${{ github.sha }} ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan AI service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/ai-service:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-ai-service, scan-containers]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive backend artifact
        if: always()
        run: |
          mkdir -p build_artifacts
          cp backend/target/*.jar build_artifacts/ 2>/dev/null || true
          ls -la build_artifacts || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-artifacts
          path: build_artifacts
