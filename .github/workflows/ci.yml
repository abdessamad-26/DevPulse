name: CI

on:
  push:
    branches: [ main, develop, 'modernize/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Build and run tests (backend)
        working-directory: backend
        run: mvn -B -V -T 1C clean test

      - name: Package backend
        working-directory: backend
        run: mvn -B -V -T 1C -DskipTests package

      # The jar is produced here, in the job that built it. (The former
      # "publish-artifacts" job started from a fresh checkout, so it never had
      # a jar to upload and silently published an empty artifact.)
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  test-ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest

      - name: Test the Python ingestion example
        run: python -m unittest discover -s examples/python -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DB_NAME: devpulse_e2e
      DB_USERNAME: devpulse
      DB_PASSWORD: e2e-only-password
      JWT_SECRET: e2e-only-ci-secret-rotate-never-use-in-production-2026
      DEMO_MODE: "true"
      SPRING_PROFILES_ACTIVE: prod
      AUTH_REFRESH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200
      FRONTEND_HOST_PORT: "3000"
      BACKEND_HOST_PORT: "8080"
      AI_SERVICE_HOST_PORT: "8000"
      POSTGRES_HOST_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start an isolated demo stack
        run: docker compose -p devpulse-e2e up --build --detach --wait --wait-timeout 300

      - name: Run browser demo flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose -p devpulse-e2e logs --no-color

      - name: Remove isolated demo stack and database
        if: always()
        run: docker compose -p devpulse-e2e down --volumes --remove-orphans

  scan-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend, build-frontend, test-ai-service, browser-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container images
        run: |
          docker build -t devpulse/backend:${{ github.sha }} ./backend
          docker build -t devpulse/ai-service:${{ github.sha }} ./ai-service
          docker build -t devpulse/frontend:${{ github.sha }} ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan AI service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/ai-service:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
