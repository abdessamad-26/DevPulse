name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build and run tests (backend)
        working-directory: backend
        run: mvn -B -V -T 1C clean test

      - name: Package backend
        working-directory: backend
        run: mvn -B -V -T 1C -DskipTests package

      # The jar is produced here, in the job that built it. (The former
      # "publish-artifacts" job started from a fresh checkout, so it never had
      # a jar to upload and silently published an empty artifact.)
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  test-ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest

  scan-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend, build-frontend, test-ai-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container images
        run: |
          docker build -t devpulse/backend:${{ github.sha }} ./backend
          docker build -t devpulse/ai-service:${{ github.sha }} ./ai-service
          docker build -t devpulse/frontend:${{ github.sha }} ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan AI service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/ai-service:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devpulse/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
