apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devpulse
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/abdessamad-26/DevPulse
  ref:
    branch: modernize/p1-quality
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devpulse
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/k8s/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: devpulse
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: backend
      namespace: devpulse
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
      namespace: devpulse
    - apiVersion: apps/v1
      kind: Deployment
      name: ai-service
      namespace: devpulse
