apiVersion: v1
kind: ConfigMap
metadata:
  name: devpulse-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_NAME: "devpulse"
  DB_USERNAME: "devpulse"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/devpulse"
  SPRING_DATASOURCE_DRIVER: "org.postgresql.Driver"
  SPRING_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  AI_SERVICE_URL: "http://ai-service:8000"
  DEMO_MODE: "false"
  CHAOS_ALLOW_PRODUCTION: "false"
  API_DOCS_ENABLED: "false"
  AUTH_RATE_LIMIT_ENABLED: "true"
  AUTH_REFRESH_COOKIE_SECURE: "true"
  CORS_ALLOWED_ORIGINS: "https://devpulse.example.com"
